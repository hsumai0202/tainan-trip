<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>專案時程｜工作排程</title>
  <style>
    :root{--ink:#242b36;--muted:#818a99;--line:#e8ebf0;--bg:#f5f6f8;--purple:#7867e8;--left:660px;--day:44px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);font-size:13px}
    button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding:26px 30px 40px;max-width:1900px;margin:auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{height:38px;width:38px;border-radius:12px;background:#eeeaff;color:var(--purple);display:grid;place-items:center;font-size:20px}.brand h1{font-size:20px;margin:0 0 3px;letter-spacing:-.3px}.brand p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:#515b69;font-weight:600;box-shadow:0 1px 2px #18223008}.btn:hover{background:#fafaff;border-color:#d8d2fb}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.btn.primary:hover{background:#6858d5}.icon-btn{width:36px;height:36px;padding:0;font-size:16px}
    .toolbar{background:#fff;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.tabs{display:flex;gap:7px}.tab{border:0;background:transparent;padding:9px 12px;color:#858d9b;border-radius:8px;font-weight:600}.tab.active{background:#f0edff;color:#6555cf}.toolbar-right{display:flex;align-items:center;gap:10px}.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:185px;outline:none}.search:focus{border-color:#a79df0}.month-label{font-weight:700;min-width:106px;text-align:center;font-size:14px}.legend{display:flex;gap:14px;color:#717b89;font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:3px;background:#b0a5ff}.dot.launch{background:#ffc879}.timeline-controls{display:flex;align-items:center;gap:7px}.timeline-control-label{font-size:10px;color:#969daa;margin-left:3px}
    .board-shell{border:1px solid var(--line);border-top:0;background:#fff;border-radius:0 0 12px 12px;overflow-x:auto;overflow-y:hidden;box-shadow:0 8px 28px #1e293b09}.board{min-width:0;--project-col:minmax(400px,1.2fr);--designer-col:minmax(250px,.8fr);--timeline-col:calc(var(--day) * 42)}.section-headings{display:grid;grid-template-columns:var(--project-col) var(--designer-col) var(--timeline-col);background:#fcfcfd;border-bottom:1px solid var(--line)}.section-heading{height:39px;display:flex;align-items:center;padding:0 16px;color:#677180;font-size:11px;font-weight:750;letter-spacing:.2px}.section-heading+.section-heading{border-left:1px solid var(--line)}.section-heading .num{width:19px;height:19px;display:grid;place-items:center;border-radius:6px;background:#efedff;color:#695bd1;margin-right:8px;font-size:10px}.calendar-head,.project-row{display:grid;grid-template-columns:var(--project-col) var(--designer-col) var(--timeline-col)}.project-head{min-height:45px;display:grid;grid-template-columns:minmax(110px,1.3fr) 105px 105px;align-items:center;padding:0 15px;color:#9299a6;font-size:10px;font-weight:700}.designer-head{min-height:45px;padding:0 15px;display:flex;align-items:center;color:#9299a6;font-size:10px;font-weight:700;border-left:1px solid var(--line)}.timeline-head{overflow:hidden;position:relative;border-left:1px solid var(--line)}.timeline-cell{height:100%;min-height:86px;overflow:hidden;border-left:1px solid var(--line)}.months{width:calc(var(--day) * 42);height:39px;border-bottom:1px solid var(--line);display:flex;align-items:center;color:#596373;font-weight:700;font-size:12px;white-space:nowrap}.days{width:calc(var(--day) * 42);height:40px;display:grid;grid-auto-columns:var(--day);grid-auto-flow:column;text-align:center;align-items:center;color:#87909d;font-size:11px}.days div{height:40px;border-left:1px solid #f0f1f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.days b{font-size:11px;color:#485362}.days .weekend{background:#fafbfc}.days .today b{color:var(--purple)}.days .today:after{content:"";height:3px;width:15px;border-radius:3px;background:var(--purple);margin-top:1px}
    .project-group{display:contents}.project-row{min-height:86px;border-top:0}.designer-info{display:flex;align-items:flex-start;padding:12px 15px;border-left:1px solid var(--line);min-width:0}.designer-stack{display:flex;flex-direction:column;gap:8px;min-width:0}.designer-entry{display:flex;align-items:center;min-height:26px;gap:8px}.designer-entry.first{margin-bottom:2px}.designer-person{display:flex;align-items:center;gap:8px;min-width:80px;max-width:108px;font-size:11px;font-weight:650}.designer-person span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.designer-project{padding:5px 9px;border-radius:7px;background:#f4f2ff;color:#6556c7;font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project-info{display:grid;grid-template-columns:minmax(110px,1fr) 64px 64px;align-items:center;margin:8px 6px 8px 8px;padding:9px 7px;gap:3px;min-height:70px;border:1px solid #eceaf7;border-radius:11px;background:#fff;box-shadow:0 2px 7px #27204409}.name-wrap{min-width:0}.project-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#303746}.cell{font-size:11px;color:#687281}.date{font-variant-numeric:tabular-nums}.date.pending{color:#aaa3cb}.project-card-line{display:grid;grid-template-columns:minmax(110px,1fr) 64px 64px;gap:3px;align-items:center;min-height:70px;margin:8px 6px 8px 8px;padding:9px 7px;border:1px solid #eceaf7;border-radius:11px;background:#fff;box-shadow:0 2px 7px #27204409;font-weight:700}.designer-project-list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;min-height:0}.designer-info{display:flex;align-items:flex-start;padding:0 15px;border-left:1px solid var(--line);min-width:0}.designer-stack{display:flex;flex-direction:column;gap:0}.designer-entry{display:flex;align-items:center;min-height:86px;gap:8px}.designer-entry.first{margin-bottom:0}.designer-person{display:flex;align-items:center;gap:8px;min-width:80px;max-width:108px;font-size:11px;font-weight:650}.designer-project{padding:5px 9px;border-radius:7px;background:#f4f2ff;color:#6556c7;font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timeline-group{border-left:1px solid var(--line)}.timeline-row{height:86px;border-bottom:1px solid #f0f1f3}.timeline-row .track{height:86px}.designer-person{display:flex;align-items:center;gap:8px;min-width:80px;max-width:108px;font-size:11px;font-weight:650}.designer-person span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.assigned-project{margin-left:7px;padding:6px 9px;border-radius:7px;background:#f4f2ff;color:#6556c7;font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avatar{height:23px;width:23px;flex:0 0 23px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;background:#eeeaff;color:#6758d0}.avatar.a2{background:#e4f4ef;color:#39866e}.avatar.a3{background:#fff0e3;color:#c27b36}.avatar.a4{background:#eaf1ff;color:#5474bd}.avatar.a5{background:#ffe9ed;color:#bb6374}.track{height:100%;min-height:86px;position:relative;background-image:linear-gradient(to right,#eff0f3 1px,transparent 1px);background-size:var(--day) 100%;background-position:left top}.track .weekend-band{position:absolute;top:0;bottom:0;background:#fafbfc;pointer-events:none}.bar{height:25px;position:absolute;top:17px;border-radius:7px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:650;box-shadow:0 2px 4px #232b3610;z-index:2}.bar.demand{background:#e9e5ff;color:#5e50bd}.bar.launch{background:#fff0d7;color:#ab711e;top:52px;height:21px;font-size:9px}.bar.muted{background:#f1f2f5;color:#8c94a0;border:1px dashed #d4d8df;box-shadow:none}.bar .bar-tag{margin-left:auto;padding-left:8px;opacity:.72}.project-row.hidden{display:none}.empty{padding:40px;text-align:center;color:#949ba7}.footer{color:#969daa;font-size:11px;padding:13px 3px}
    .modal-backdrop{position:fixed;inset:0;background:#1e24304d;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(460px,100%);border-radius:14px;padding:22px;box-shadow:0 20px 60px #14192740}.modal h2{font-size:17px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#707a88;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);background:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:21px}.delete{margin-right:auto;color:#bd5360}.close{background:none;border:0;font-size:20px;color:#87909d;float:right;line-height:1}
    /* compact viewing layout */
    .project-row{min-height:58px}
    .project-info{margin:2px 4px 2px 6px;min-height:52px;padding:6px 6px}
    .project-card-line{min-height:52px;margin:2px 4px 2px 6px;padding:6px 6px}
    .designer-entry{min-height:58px}
    .timeline-row,.timeline-row .track,.timeline-cell{height:58px;min-height:58px}
    .bar{top:7px}.bar.launch{top:34px}
    .project-head,.designer-head{min-height:36px}
    @media(max-width:760px){.app{padding:17px 12px 28px}.topbar{align-items:flex-start;gap:12px}.brand h1{font-size:17px}.actions .btn:not(.primary){display:none}.toolbar{align-items:flex-start;gap:12px;flex-direction:column}.toolbar-right{width:100%;justify-content:space-between}.search{width:145px}.board{--project-col:285px;--designer-col:240px;--timeline-col:calc(var(--day) * 42)}.project-head,.project-info{grid-template-columns:minmax(90px,1fr) 58px 58px;gap:3px}.project-info{margin:7px 5px;padding:8px 6px}:root{--day:40px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="logo">▥</div><div><h1>專案時程</h1><p>設計工作排程與上線進度</p></div></div><div class="actions"><button class="btn" id="todayBtn">回到今天</button></div></header>
    <section class="toolbar"><nav class="tabs"><button class="tab active">總覽</button><button class="tab">依設計師</button><button class="tab">依上線日期</button></nav><div class="toolbar-right"><div class="legend"><span><i class="dot"></i>需求至上線</span><span><i class="dot launch"></i>上線日</span></div><div class="timeline-controls"><button class="btn icon-btn" id="prevBtn" aria-label="前一週">‹</button><div class="month-label" id="monthLabel"></div><button class="btn icon-btn" id="nextBtn" aria-label="後一週">›</button></div><span class="timeline-control-label">可拖動下方捲軸往右</span><input class="search" id="search" placeholder="⌕ 搜尋專案或設計師" /></div></section>
    <section class="board-shell"><div class="board" id="board"></div></section>
    <div class="footer">拖動月份按鈕瀏覽其他日期 · 點選專案列可編輯 · 資料儲存在此瀏覽器</div>
  </main>
  <script>
    const y=2026, seed=[
      {id:'a',name:'A 專案',demand:'2026-10-12',launch:'2026-10-26',designer:'阿妹'},
      {id:'b',name:'B 專案',demand:'2026-10-08',launch:'2026-10-20',designer:'ben'},
      {id:'c',name:'C 專案',demand:'',launch:'2026-10-30',designer:'max'},
      {id:'d',name:'D 專案',demand:'',launch:'2026-11-11',designer:''},
      {id:'e',name:'E 專案',demand:'',launch:'2026-11-13',designer:''},
      {id:'f',name:'F 專案',demand:'2026-10-19',launch:'2026-11-03',designer:'阿妹'},
      {id:'g',name:'G 專案',demand:'2026-10-22',launch:'2026-11-06',designer:'ben'}
    ];
    let projects;try{projects=JSON.parse(localStorage.getItem('projectScheduleV1'))||seed}catch{projects=seed}
    for(const sample of seed.slice(5))if(!projects.some(p=>p.id===sample.id))projects.push(sample);
    localStorage.setItem('projectScheduleV1',JSON.stringify(projects));
    let viewStart=new Date(2026,9,5), editing=null;
    const $=s=>document.querySelector(s), fmt=d=>`${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
    const parse=s=>{if(!s)return null;const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
    const dayDiff=(a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const peopleOrder=['阿妹','ben','max','待確認'];
    function initials(s){return s==='待確認'?'?':Array.from(s).slice(0,1).join('').toUpperCase()}
    function render(){
      const total=42, end=new Date(viewStart);end.setDate(end.getDate()+total-1);$('#monthLabel').textContent=viewStart.getFullYear()===end.getFullYear()&&viewStart.getMonth()===end.getMonth()?`${viewStart.getFullYear()}年${viewStart.getMonth()+1}月`:`${viewStart.getFullYear()}年${viewStart.getMonth()+1}月 – ${end.getMonth()+1}月`;
      const dates=Array.from({length:total},(_,i)=>{const d=new Date(viewStart);d.setDate(d.getDate()+i);return d});
      const monthSegments=[];dates.forEach((d,i)=>{let key=`${d.getFullYear()}-${d.getMonth()}`;let last=monthSegments[monthSegments.length-1];if(last&&last.key===key)last.span++;else monthSegments.push({key,label:`${d.getFullYear()}年${d.getMonth()+1}月`,span:1})});
      const months=monthSegments.map(m=>`<span style="display:inline-block;flex:0 0 calc(var(--day) * ${m.span})">${m.label}</span>`).join('');
      const days=dates.map((d,i)=>`<div class="${[0,6].includes(d.getDay())?'weekend ':''}${d.toDateString()===new Date().toDateString()?'today':''}"><b>${d.getDate()}</b><span>${['日','一','二','三','四','五','六'][d.getDay()]}</span></div>`).join('');
      const filter=$('#search').value.trim().toLowerCase(); const names=[...new Set(projects.map(p=>p.designer||'待確認'))];
      const colorIdx=n=>['','a2','a3','a4','a5'][Math.max(0,names.indexOf(n))%5];
      let html=`<div class="section-headings"><div class="section-heading"><span class="num">1</span>所有專案</div><div class="section-heading"><span class="num">2</span>設計者與執行專案</div><div class="section-heading"><span class="num">3</span>時間軸</div></div><div class="calendar-head"><div class="project-head"><span>專案名稱</span><span>需求提供日</span><span>上線時間</span></div><div class="designer-head">負責設計師 · 執行專案</div><div class="timeline-head"><div class="months">${months}</div><div class="days">${days}</div></div></div>`;
      const assignedProjects=projects.filter(p=>p.designer&&p.designer.trim());
      const projectsByDesigner=[...new Set(assignedProjects.map(p=>p.designer))].map(name=>({name,items:assignedProjects.filter(p=>p.designer===name)}));
      projectsByDesigner.forEach(group=>{const visible=group.items.filter(p=>(p.name+' '+group.name).toLowerCase().includes(filter));if(!visible.length)return;const designer=group.name,color=colorIdx(designer);let entries=visible.map((p,i)=>`<div class="designer-entry ${i===0?'first':''}">${i===0?`<span class="designer-person"><i class="avatar ${color}">${esc(initials(designer))}</i><span>${esc(designer)}</span></span>`:`<span class="designer-person" style="visibility:hidden"><i class="avatar ${color}">${esc(initials(designer))}</i><span>${esc(designer)}</span></span>`}<span class="designer-project">${esc(p.name)}</span></div>`).join('');html+=`<div class="project-row designer-group-row"><div class="project-info designer-project-list">${visible.map(p=>`<div class="project-card-line"><span>${esc(p.name)}</span><span class="cell date ${p.demand?'':'pending'}">${p.demand?fmt(parse(p.demand)):'待確認'}</span><span class="cell date">${fmt(parse(p.launch))}</span></div>`).join('')}</div><div class="designer-info"><div class="designer-stack">${entries}</div></div><div class="timeline-group">${visible.map(p=>{const demand=parse(p.demand),launch=parse(p.launch);let start=demand||new Date(launch);if(!demand)start.setDate(start.getDate()-4);let left=dayDiff(start,viewStart),width=demand?Math.max(1,dayDiff(launch,demand)+1):Math.max(2,dayDiff(launch,start));let launchLeft=dayDiff(launch,viewStart),barLeft=Math.max(0,left),barRight=Math.min(total,left+width),barWidth=Math.max(0,barRight-barLeft);const weekendBands=dates.map((d,i)=>[0,6].includes(d.getDay())?`<i class="weekend-band" style="left:calc(var(--day) * ${i});width:var(--day)"></i>`:'').join('');return `<div class="timeline-row"><div class="track" style="width:calc(var(--day) * ${total})">${weekendBands}${barWidth>0?`<div class="bar ${demand?'demand':'muted'}" style="left:calc(var(--day) * ${barLeft});width:calc(var(--day) * ${barWidth} - 5px)">${demand?esc(p.name):'待確認需求日'}<span class="bar-tag">${demand?width+' 天':'待排程'}</span></div>`:''}<div class="bar launch" style="left:calc(var(--day) * ${launchLeft});width:calc(var(--day) * .9 - 2px)">上線</div></div></div>`}).join('')}</div></div>`});
      /* legacy row rendering removed */
      if(!projects.length)html+=`<div class="empty">還沒有專案，按「新增專案」開始建立排程。</div>`;
      $('#board').innerHTML=html;
    }
    function save(){localStorage.setItem('projectScheduleV1',JSON.stringify(projects));render()}
    $('#prevBtn').onclick=()=>{viewStart.setDate(viewStart.getDate()-14);render()};$('#nextBtn').onclick=()=>{viewStart.setDate(viewStart.getDate()+14);render()};$('#todayBtn').onclick=()=>{const now=new Date();viewStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-7);render()};$('#search').oninput=render;
    render();
  </script>
</body>
</html>
